name: Generate Quiz Videos

on:
  push:
    branches: [main]
    paths-ignore:
      - data/history/history.json
  workflow_dispatch:
  schedule:
    # Run 4 times per day (GitHub Actions uses UTC).
    # IST: 07:30, 13:30, 19:30, 01:30 next day.
    - cron: "0 2,8,14,20 * * *"

permissions:
  contents: write

concurrency:
  group: quiz-video
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify or install FFmpeg
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "FFmpeg already available on runner"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check --prefer-binary -r requirements.txt

      - name: Prepare folders
        run: |
          mkdir -p data/history output
          if [ ! -f data/history/history.json ]; then
            echo '{"version": 2, "counters": {}, "last_run": {}}' > data/history/history.json
          fi

      - name: Generate and publish quiz videos
        run: python app.py
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          APP_NAME: Smart Learning Lab 247
          INSTAGRAM_PAGES: https://www.instagram.com/smartlearninglab247,https://www.instagram.com/cgl_ssc_railway_rpsc_bank
          FACEBOOK_PAGE_URL: https://www.facebook.com/smartlearninglab247
          EDUAPPNAME: https://smartlearninglab-react.pages.dev/
          YOUTUBE_PLAYLIST_TITLE: Smart Learning Lab 247
          YOUTUBE_PRIVACY_STATUS: public
          YOUTUBE_CATEGORY_ID: 27
          YOUTUBE_MADE_FOR_KIDS: false
          YOUTUBE_LANGUAGE: en
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          YOUTUBE_DEFAULT_TAGS: smart learning lab 247,quiz,competitive exams,ssc,upsc,banking,railway,ras,ias,gk,mock test
          TTS_VOICE: en-IN-NeerjaNeural
          TTS_RATE: +0%
          TTS_VOLUME: +0%
          PAGE_URL: ${{ secrets.PAGE_URL }}
          VIDEO_WIDTH: 720
          VIDEO_HEIGHT: 1280
          FPS: 15
          VIDEO_CRF: 30
          TTS_CONCURRENCY: 6

      - name: Commit quiz counters
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/history/history.json
          git commit -m "Update quiz source counters" || exit 0
          git pull --rebase origin main
          git push origin main

